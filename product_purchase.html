<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eagle Pass 골프</title>
    <meta name="description" content="Eagle Pass 골프" />
    <meta name="keywords" content="Eagle Pass 골프" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./img/og.png" />
    <meta property="og:title" content="Eagle Pass 골프" />
    <meta property="og:description" content="Eagle Pass 골프" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/common.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/response.css" />
  </head>
  <body>
    <div class="wrap">
      <!-- header -->
      <header>
        <h2>
          <img src="./img/assets/ico_left_arrow.svg" alt="왼쪽 화살표 아이콘" />
          <p>상품결제</p>
        </h2>
        <div class="right">
          <a href="./main.html">
            <img src="./img/assets/ico_setting_white.svg" alt="설정아이콘" />
          </a>
        </div>
      </header>
      <!-- navigation bar -->
      <nav class="navigation-bar">
        <ul class="navigation-bar__list">
          <li>
            <a href="./checkin.html">
              <span>
                <img
                  src="./img/assets/ico_main_booking_check_2.svg"
                  alt="예약확인 메뉴 아이콘"
                />
              </span>
              예약확인
            </a>
          </li>
          <li>
            <a href="./purchase.html" class="click">
              <span>
                <img
                  src="./img/assets/ico_main_purchase_2.svg"
                  alt="구메내역 메뉴 아이콘"
                />
              </span>
              구메내역
            </a>
          </li>
          <li>
            <a href="./main.html">
              <span>
                <img src="./img/assets/ico_home_2.svg" alt="메인 아이콘" />
              </span>
              메인
            </a>
          </li>
          <li>
            <a href="./use.html">
              <span>
                <img
                  src="./img/assets/ico_main_use_2.svg"
                  alt="이용내역 메뉴 아이콘"
                />
              </span>
              이용내역
            </a>
          </li>
          <li>
            <a href="./product.html">
              <span>
                <img
                  src="./img/assets/ico_main_product_2.svg"
                  alt="상품구매 메뉴 아이콘"
                />
              </span>
              상품구매
            </a>
          </li>
        </ul>
      </nav>
      <div class="container">
        <div class="product prefer on">
          <div class="option-info-box">
            <p class="name">정기권 3개월 (일 60분)</p>
            <span>(주중 60분 주말 50분 이용)</span>
          </div>
          <div class="check-point">
            <p>특판가 220,000 (정가 250,000)</p>
            <span class="period">2026년 3월 31일 까지</span>
          </div>
        </div>

        <div class="purchase_box">
          <div>
            <p>선택 이용권</p>
            <span>쿠폰 30장 (일 50분)</span>
          </div>
          <div>
            <p>구매 금액</p>
            <span>270,000원</span>
          </div>

          <div class="btn_box">
            <button type="button">결제</button>
            <button type="button" onclick="location.href = 'product.html'">
              취소
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
